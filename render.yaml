services:
  - type: web
    name: ava-mcp-adapter
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn adapter:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: AVA_AGENT_URL
        value: https://ava-agent-qzmu.onrender.com
      - key: AVA_AGENT_API_KEY
        sync: false
      - key: AVA_AGENT_TIMEOUT
        value: "30"
